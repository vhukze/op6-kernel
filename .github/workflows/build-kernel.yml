name: Build OnePlus6 Kernel for APatch + KPM

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'tools/**'

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_oneplus_sdm845
  KERNEL_BRANCH: lineage-22.2
  CLANG_VERSION: clang-r522817

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential flex libssl-dev libelf-dev \
            python3 zip unzip rsync cpio liblz4-tool git curl \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: 拉取内核源码
        run: |
          git clone --depth=1 -b "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel
          cd kernel
          echo "内核版本: $(sed -n 's/^VERSION = //p' Makefile).$(sed -n 's/^PATCHLEVEL = //p' Makefile).$(sed -n 's/^SUBLEVEL = //p' Makefile)"

      - name: 探测 defconfig
        run: |
          cd kernel
          for c in vendor/enchilada_defconfig enchilada_defconfig; do
            if [ -f "arch/arm64/configs/$c" ]; then
              echo "DEFCONFIG=$c" >> "$GITHUB_ENV"
              echo "[+] 选中 defconfig: $c"
              exit 0
            fi
          done
          ls arch/arm64/configs/
          exit 1

      - name: 缓存 clang 工具链
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-${{ env.CLANG_VERSION }}-v3

      - name: 拉取 clang 工具链
        run: |
          if [ -x clang/bin/clang ]; then
            echo "[+] 命中缓存"
            ./clang/bin/clang --version | head -1
            exit 0
          fi
          for attempt in 1 2 3; do
            rm -rf clang
            if git clone --depth=1 \
                 "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_${CLANG_VERSION}" clang 2>/dev/null \
               && [ -x clang/bin/clang ]; then
              echo "[+] 使用 LineageOS prebuilt clang"
              ./clang/bin/clang --version | head -1
              exit 0
            fi
            sleep 10
          done
          echo "[!] 回落到 apt clang-14"
          sudo apt-get install -y -qq clang-14
          mkdir -p clang/bin
          ln -sf /usr/bin/clang-14 clang/bin/clang

      - name: 合并 APatch/KPM 内核配置
        run: |
          python3 tools/apply_config.py "kernel/arch/arm64/configs/${DEFCONFIG}" tools/extra_config.conf

      - name: 编译前检查关键配置
        run: |
          cd kernel
          echo "===== 目标配置是否正确写入 defconfig ====="
          grep -E '^CONFIG_(MODULES|KALLSYMS|KALLSYMS_ALL|KPROBES|FTRACE|DYNAMIC_FTRACE)=' "arch/arm64/configs/${DEFCONFIG}" || true
          echo "--- 应当不存在（模块签名强制）---"
          grep -E '^CONFIG_MODULE_SIG' "arch/arm64/configs/${DEFCONFIG}" || echo "[+] MODULE_SIG 相关项已移除"

      - name: 编译内核
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          MAKE_ARGS="CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          echo "===== 工具链自检 ====="
          which clang; clang --version | head -1
          which aarch64-linux-gnu-gcc; aarch64-linux-gnu-gcc --version | head -1

          make O=out ARCH=arm64 $MAKE_ARGS "${DEFCONFIG}"

          # 编译后强制校验：MODULE_SIG_FORCE 必须是 n
          if grep -q '^CONFIG_MODULE_SIG_FORCE=y' out/.config; then
            echo "[:!] CONFIG_MODULE_SIG_FORCE=y —— KPM 会加载失败，手动关闭"
            sed -i 's/^CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/' out/.config
            sed -i 's/^CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/' out/.config
            sed -i 's/^CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/' out/.config
          fi

          # clang 17 对 4.9 老内核远比当年的 gcc 严格。
          # 下面这些都是**既有代码**的告警（无线驱动、文件系统、时钟等），
          # 不是本次改动引入的逻辑问题，统一降级为 warning，避免逐条重试。
          export KCFLAGS=""
          for w in \
            constant-conversion \
            implicit-const-int-float-conversion \
            unused-but-set-variable \
            unused-variable \
            unused-const-variable \
            unused-function \
            unused-label \
            array-bounds \
            logical-not-parentheses \
            parentheses-equality \
            sometimes-uninitialized \
            uninitialized-const-pointer \
            incompatible-pointer-types \
            int-conversion \
            enum-conversion \
            implicit-function-declaration \
            format \
            format-extra-args \
            switch \
            misleading-indentation \
            tautological-compare \
            duplicate-decl-specifier \
            address-of-packed-member \
            missing-braces \
            unknown-warning-option \
            deprecated-declarations \
            gnu-variable-sized-type-not-at-end \
            frame-address \
            attribute-packed-for-bitfield \
            macro-redefined \
            builtin-requires-header \
            suspicious-move \
            sizeof-array-argument \
          ; do
            KCFLAGS="$KCFLAGS -Wno-error=$w"
          done
          export KCFLAGS
          echo "KCFLAGS = $KCFLAGS"
          make -j$(nproc) O=out ARCH=arm64 $MAKE_ARGS

          echo "===== 产物 ====="
          find out/arch/arm64/boot -maxdepth 1 -type f | sort

      - name: 验证内核满足 KPM 条件
        run: |
          cd kernel
          IMG=""
          for f in out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image; do
            [ -f "$f" ] && IMG="$f" && break
          done
          if [ -z "$IMG" ]; then echo "[:!] 没找到内核镜像"; exit 1; fi
          echo "内核镜像: $IMG ($(stat -c %s "$IMG") 字节)"

          echo "===== KPM 前置条件检查 ====="
          FAIL=0

          if grep -q '^CONFIG_MODULE_SIG_FORCE=y' out/.config; then
            echo "[:!] MODULE_SIG_FORCE=y —— KPM 无法加载"; FAIL=1
          else
            echo "[+] MODULE_SIG_FORCE 已关闭"
          fi

          for c in MODULES KALLSYMS KALLSYMS_ALL KPROBES FTRACE DYNAMIC_FTRACE; do
            if grep -q "^CONFIG_${c}=y" out/.config; then
              echo "[+] CONFIG_${c}=y"
            else
              echo "[:!] CONFIG_${c} 未启用"; FAIL=1
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            echo "[:!] 有前置条件未满足，KPM 可能不可用"
            exit 1
          fi
          echo "[+] 全部前置条件满足"

      - name: 打包 AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          rm -rf .git examples

          IMG=""
          for f in ../kernel/out/arch/arm64/boot/Image.gz ../kernel/out/arch/arm64/boot/Image.gz-dtb ../kernel/out/arch/arm64/boot/Image; do
            [ -f "$f" ] && IMG="$f" && break
          done
          if [ -z "$IMG" ]; then echo "[:!] 没找到内核镜像"; exit 1; fi

          mkdir -p kernel
          cp "$IMG" kernel/
          ls -la kernel/

          sed -i 's|^kernel\.string=.*|kernel.string=APatch-KPM enchilada (LineageOS 22.2 / 4.9)|' anykernel.sh
          sed -i 's|^device\.name1=.*|device.name1=enchilada|' anykernel.sh
          sed -i 's|^device\.name2=.*|device.name2=OnePlus6|' anykernel.sh
          sed -i 's|^device\.name3=.*|device.name3=|' anykernel.sh
          sed -i 's|^device\.name4=.*|device.name4=|' anykernel.sh
          sed -i 's|^device\.name5=.*|device.name5=|' anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/bootdevice/by-name/boot;|' anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|' anykernel.sh

          zip -r9 "../APatch-KPM-enchilada-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}.zip" . -x '*.zip'
          ls -la ../APatch-KPM-enchilada-*.zip

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enchilada-apatch-kpm-${{ github.run_number }}
          path: |
            kernel/out/arch/arm64/boot/Image.gz
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/arch/arm64/boot/Image
            kernel/out/.config
            APatch-KPM-enchilada-*.zip
          if-no-files-found: warn
          retention-days: 30
