# ============================================================================
# OnePlus 6 (enchilada) / msm-4.9 全功能内核配置增量
# 由 tools/apply_config.py 追加到 arch/arm64/configs/enchilada_defconfig
#
# 注意: 一加6 内核 4.9，SUSFS 依赖 THREAD_INFO_IN_TASK (Linux 4.11+ / arm64 4.16+)，
#       4.9 上根本无法启用，且 susfs4ksu 的 susfs.h 无处可得，因此显式关闭。
#       KPM 只依赖 KSU + 64BIT，4.9 可用。
# ============================================================================

# ---------- 1. 杂鱼 root 本体（builtin 分支手动 hook 必需）----------
CONFIG_KSU=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_EXT4_FS=y
CONFIG_SECURITY_SELINUX=y
CONFIG_SECCOMP=y

# ---------- 2. SUSFS: 4.9 不可用，显式关闭 ----------
# CONFIG_KSU_SUSFS is not set

# ---------- 3. KPM 运行时内核模块 ----------
# 注意: SukiSU 是单一编译单元(ksu_main.c 用 #include "xxx.c" 拼装)，
#       CONFIG_KPM 只控制运行时行为，不影响编译。KPM 源码里的 4.9 兼容
#       问题由 tools/patch_ksu_hooks.py 直接修源码解决。
CONFIG_KPM=y

# ---------- 4. 命名空间 / 容器（LXC、真 chroot、podman）----------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y

# ---------- 5. 文件系统（metamodule overlayfs 挂载）----------
CONFIG_OVERLAY_FS=y
CONFIG_FUSE_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_TUN=y

# ---------- 6. 网络（nftables / TPROXY 透明代理 / eBPF）----------
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_NAT=y
CONFIG_NFT_TPROXY=y
CONFIG_NFT_SOCKET=y
CONFIG_NETFILTER_XT_TARGET_TPROXY=y
CONFIG_NETFILTER_XT_MATCH_SOCKET=y
CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
CONFIG_IP_NF_TARGET_REDIRECT=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_NET_CLS_BPF=y
CONFIG_NET_SCH_INGRESS=y
CONFIG_NET_CLS_ACT=y

# ---------- 7. USB gadget（BadUSB / HID / 网卡共享 / NetHunter）----------
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_CONFIGFS_F_RNDIS=y
CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_F_UAC1=y
CONFIG_USB_CONFIGFS_F_ACC=y
CONFIG_USB_CONFIGFS_SERIAL=y

# ---------- 8. 调试（KPM 开发必需）----------
CONFIG_MAGIC_SYSRQ=y
CONFIG_PROC_KCORE=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_FRAME_POINTER=y

# ---------- 9. NetHunter 无线攻击支持（外接 USB 网卡）----------
# mac80211 无线栈 —— 一加6 官方内核把这项砍了，必须自己开
CONFIG_MAC80211=y
CONFIG_MAC80211_MESH=y
CONFIG_MAC80211_LEDS=y
CONFIG_MAC80211_DEBUGFS=y
CONFIG_MAC80211_RC_MINSTREL=y
CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
CONFIG_CFG80211_WEXT=y
CONFIG_CFG80211_DEBUGFS=y
CONFIG_CFG80211_DEFAULT_PS=y

# Atheros AR9271 / AR7010（NetHunter 社区首选，最稳）
CONFIG_ATH_COMMON=y
CONFIG_ATH9K_HTC=y
CONFIG_ATH9K_HTC_DEBUGFS=y

# Realtek（RTL8188EU/EUS、RTL8192CU、RTL8XXXU）
CONFIG_RTL_CARDS=y
CONFIG_R8188EU=y
CONFIG_RTL8192CU=y
CONFIG_RTL8XXXU=y
CONFIG_RTL8XXXU_UNTESTED=y

# MediaTek（MT7601U，4.9 主线支持到此为止）
CONFIG_MT7601U=y

# Ralink（RT3070 / RT5370 / RT73，NetHunter 常备）
CONFIG_RT2X00=y
CONFIG_RT2800USB=y
CONFIG_RT2800USB_RT33XX=y
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT3573=y
CONFIG_RT2800USB_RT53XX=y
CONFIG_RT2800USB_RT55XX=y
CONFIG_RT2800USB_UNKNOWN=y
CONFIG_RT73USB=y

# USB 有线网卡
CONFIG_USB_USBNET=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_CDC_NCM=y
CONFIG_USB_NET_RNDIS_HOST=y
CONFIG_USB_NET_AX8817X=y

# 无线扩展（注入/monitor 相关）
CONFIG_WLAN_VENDOR_ATH=y
CONFIG_WLAN_VENDOR_RALINK=y
CONFIG_WLAN_VENDOR_REALTEK=y
CONFIG_WLAN_VENDOR_MEDIATEK=y
