# ============================================================================
# OnePlus 6 (enchilada) / msm-4.9 —— APatch KernelPatch + KPM 专用配置
#
# 目标：让内核满足 KernelPatch(KPM) 的加载条件
#
# 关键点：
#   1. MODULE_SIG_FORCE 必须关闭
#      LineageOS 官方内核默认 CONFIG_MODULE_SIG_FORCE=y，
#      这会拒绝一切未签名模块，包括 APatch 的 KPM。
#   2. KALLSYMS_ALL 必须开启（KernelPatch 靠它定位符号）
#   3. 不集成任何 root 方案源码（APatch 是运行时补丁，不需要）
# ============================================================================

# ---------- 1. 模块加载基础 ----------
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
CONFIG_MODULE_FORCE_LOAD=y

# 关闭签名强制 —— KPM 和自定义 .ko 的前提
# CONFIG_MODULE_SIG is not set
# CONFIG_MODULE_SIG_FORCE is not set
# CONFIG_MODULE_SIG_ALL is not set

# ---------- 2. 符号表（KernelPatch 必需）----------
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_KALLSYMS_BASE_RELATIVE=y

# ---------- 3. KPM 运行时 ----------
# KernelPatch 的 KPM 依赖这些基础设施
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_DYNAMIC_FTRACE=y

# ---------- 4. 安全（保留 SELinux，关闭强制模块签名）----------
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y
CONFIG_SECCOMP=y

# ---------- 5. 命名空间（容器支持）----------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y

# ---------- 6. 文件系统 ----------
CONFIG_OVERLAY_FS=y
CONFIG_FUSE_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_TUN=y

# ---------- 7. 网络（nftables / TPROXY）----------
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_NAT=y
CONFIG_NFT_TPROXY=y
CONFIG_NFT_SOCKET=y
CONFIG_NETFILTER_XT_TARGET_TPROXY=y
CONFIG_NETFILTER_XT_MATCH_SOCKET=y
CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
CONFIG_IP_NF_TARGET_REDIRECT=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_NET_CLS_BPF=y

# ---------- 8. USB 网络（NetHunter RNDIS）----------
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_CONFIGFS_RNDIS=y
CONFIG_USB_CONFIGFS_ECM=y
CONFIG_USB_CONFIGFS_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_F_HID=y

# ---------- 9. 无线（monitor mode / 注入）----------
CONFIG_MAC80211=y
CONFIG_MAC80211_MESH=y
CONFIG_MAC80211_LEDS=y
CONFIG_MAC80211_DEBUGFS=y
CONFIG_CFG80211_WEXT=y
CONFIG_CFG80211_DEBUGFS=y
CONFIG_ATH_COMMON=m
# ATH9K_HTC 必须编成模块(=m)：
#   drivers/staging/qcacld-3.0（本机原生高通 WLAN 驱动，必须 built-in）
#   内部也定义了 htc_connect_service / htc_start / htc_stop，
#   若 ath9k_htc 也 built-in 则符号冲突，链接失败。
#   改成模块后按需 insmod，不参与 built-in 链接。
CONFIG_ATH9K_HTC=m
CONFIG_RTL_CARDS=m
# R8188EU 是 staging 驱动，内部自带一份 HTC 实现，与 ath9k_htc 的
# htc_connect_service / htc_start / htc_stop 符号冲突，导致 built-in 链接失败。
# 改用主线 rtl8xxxu（同样支持 RTL8188EU），功能等价且无冲突。
# CONFIG_R8188EU is not set
CONFIG_RTL8192CU=m
CONFIG_RTL8XXXU=m
CONFIG_RTL8XXXU_UNTESTED=y
CONFIG_MT7601U=m
CONFIG_RT2X00=m
CONFIG_RT2800USB=m
CONFIG_RT2800USB_RT33XX=y
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT53XX=y
CONFIG_RT73USB=m
CONFIG_USB_USBNET=y
CONFIG_USB_NET_CDCETHER=y
CONFIG_USB_NET_CDC_NCM=y
CONFIG_USB_NET_RNDIS_HOST=y
CONFIG_USB_NET_AX8817X=y

# ---------- 10. 性能调优相关 ----------
CONFIG_SCHED_TUNE=y
CONFIG_CPU_BOOST=y
CONFIG_SCHED_WALT=y

# ---------- 11. 调试信息（关键：规避 DWARF5 与老 binutils 的冲突）----------
# clang 17 默认产出 DWARF5，ubuntu-22.04 的 ld 不认 form 0x22/0x23，
# 报 "Unrecognized form" 并把正常符号误判为 multiple definition。
# 内核镜像不需要调试信息，全部关闭。
# CONFIG_DEBUG_INFO is not set
# CONFIG_DEBUG_INFO_DWARF4 is not set
# CONFIG_DEBUG_INFO_REDUCED is not set
# CONFIG_DEBUG_INFO_SPLIT is not set
# CONFIG_DEBUG_INFO_BTF is not set
CONFIG_DEBUG_KERNEL=y
# CONFIG_DEBUG_INFO_COMPRESSED is not set
