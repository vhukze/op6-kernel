# ============================================================================
# OnePlus 6 (enchilada) / msm-4.9 全功能内核配置增量
# 由 tools/apply_config.py 追加到 arch/arm64/configs/enchilada_defconfig
#
# 注意: 一加6 内核 4.9，SUSFS 依赖 THREAD_INFO_IN_TASK (Linux 4.11+ / arm64 4.16+)，
#       4.9 上根本无法启用，且 susfs4ksu 的 susfs.h 无处可得，因此显式关闭。
#       KPM 只依赖 KSU + 64BIT，4.9 可用。
# ============================================================================

# ---------- 1. 杂鱼 root 本体（builtin 分支手动 hook 必需）----------
CONFIG_KSU=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
CONFIG_EXT4_FS=y
CONFIG_SECURITY_SELINUX=y
CONFIG_SECCOMP=y

# ---------- 2. SUSFS: 4.9 不可用，显式关闭 ----------
# CONFIG_KSU_SUSFS is not set

# ---------- 3. KPM: 4.9 上依赖 5.0+ 的 access_ok 签名与 4.13+ 的 set_memory.h
#             第一阶段先关闭，优先让 root 主体跑通，KPM 适配单独做
# CONFIG_KPM is not set

# ---------- 4. 命名空间 / 容器（LXC、真 chroot、podman）----------
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_MEMCG=y
CONFIG_BLK_CGROUP=y

# ---------- 5. 文件系统（metamodule overlayfs 挂载）----------
CONFIG_OVERLAY_FS=y
CONFIG_FUSE_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_EXT4_FS_SECURITY=y
CONFIG_TUN=y

# ---------- 6. 网络（nftables / TPROXY 透明代理 / eBPF）----------
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NFT_NAT=y
CONFIG_NFT_TPROXY=y
CONFIG_NFT_SOCKET=y
CONFIG_NETFILTER_XT_TARGET_TPROXY=y
CONFIG_NETFILTER_XT_MATCH_SOCKET=y
CONFIG_NETFILTER_XT_TARGET_REDIRECT=y
CONFIG_IP_NF_TARGET_REDIRECT=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_NET_CLS_BPF=y
CONFIG_NET_SCH_INGRESS=y
CONFIG_NET_CLS_ACT=y

# ---------- 7. USB gadget（BadUSB / HID / 网卡共享 / NetHunter）----------
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_F_FS=y
CONFIG_USB_CONFIGFS_F_HID=y
CONFIG_USB_CONFIGFS_F_RNDIS=y
CONFIG_USB_CONFIGFS_F_MASS_STORAGE=y
CONFIG_USB_CONFIGFS_F_UAC1=y
CONFIG_USB_CONFIGFS_F_ACC=y
CONFIG_USB_CONFIGFS_SERIAL=y

# ---------- 8. 调试（KPM 开发必需）----------
CONFIG_MAGIC_SYSRQ=y
CONFIG_PROC_KCORE=y
CONFIG_IKCONFIG=y
CONFIG_IKCONFIG_PROC=y
CONFIG_FRAME_POINTER=y
